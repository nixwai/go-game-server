services:
  mysql:
    image: ${MYSQL_IMAGE:?MYSQL_IMAGE is required in .env}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required in .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:?MYSQL_PORT is required in .env}:3306"
    volumes:
      - "${MYSQL_DATA_PATH:-mysql_data}:/var/lib/mysql"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    image: go-game-server:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_MIGRATE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["./migrate", "up"]

  app:
    image: go-game-server:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      HTTP_ADDR: ":8080"
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local"
    ports:
      - "127.0.0.1:${HTTP_PORT:?HTTP_PORT is required in .env}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
