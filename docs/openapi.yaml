openapi: 3.0.3
info:
  title: Go Game Server Auth API
  version: 1.0.0
  description: |
    Go Game Server 认证后端接口文档。

    ## 通用约定

    - 所有接口统一返回 HTTP 200，前端通过响应体 `code` 字段判断业务结果。
    - `code=0` 表示业务成功，非 0 表示具体错误类型。
    - 需要认证的接口必须在请求头携带 `Authorization: Bearer <jwt>`。
    - 每个请求可通过 `X-Request-ID` 请求头传入自定义追踪 ID，服务端会原样回写响应头。
    - 服务端异常不会返回内部堆栈或敏感信息。

    ## 业务码说明

    | 业务码 | 含义 |
    |--------|------|
    | 0 | 成功 |
    | 1001 | 参数校验失败 |
    | 2001 | 用户名或密码错误 |
    | 2002 | 令牌缺失、无效或已过期 |
    | 3001 | 权限不足 |
    | 4001 | 资源冲突（如用户名重复）|
    | 4004 | 资源不存在 |
    | 4005 | 默认 AI 配置不可修改或删除 |
    | 4006 | 传输层 RSA 解密失败 |
    | 4007 | 模型或产商已禁用 |
    | 4008 | 当日注册量已达上限 |
    | 9000 | 服务器内部错误 |
    | 9001 | 加密主密钥未配置或无效 |
    | 9002 | LLM API 调用失败 |
    | 9003 | LLM 返回格式无效 |
servers:
  - url: http://localhost:8080
    description: 本地开发环境
tags:
  - name: health
    description: 健康检查
  - name: auth
    description: 认证相关接口
  - name: admin
    description: 管理员接口
  - name: ai
    description: AI 模型管理接口
  - name: aigo
    description: AI 围棋对弈接口
paths:
  /health:
    get:
      tags: [health]
      summary: 健康检查
      description: 检查服务是否存活，不需要身份认证。
      operationId: healthCheck
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: 成功
                data:
                  status: 正常
  /api/v1/auth/public-key:
    get:
      tags: [auth]
      summary: 获取 RSA 公钥
      description: |
        返回服务端生成的 RSA 公钥（PEM 格式），供前端加密密码使用。

        公钥在服务启动时生成，每次重启后会变化。前端应在注册、登录、修改密码前先获取公钥，
        使用 RSA-OAEP + SHA-256 加密密码，再 base64 编码后作为 password 字段提交。

        此接口不需要身份认证。
      operationId: getAuthPublicKey
      responses:
        200:
          description: 公钥获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: 成功
                data:
                  public_key: RSA-PEM-PUBLIC-KEY-PLACEHOLDER
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 用户注册
      description: |
        注册普通用户。

        **安全约束：**
        - 注册接口固定创建 `user` 角色账户，客户端无法通过此接口创建管理员。
        - 密码以 Argon2id 哈希形式存储，明文不落库。
        - password 字段为前端使用 RSA 公钥加密后 base64 编码的密文，非明文密码。
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: alice
              password: <base64-encoded-RSA-ciphertext>
      responses:
        '200':
          description: 注册成功或失败（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 注册成功
                  value:
                    code: 0
                    message: 成功
                    data:
                      id: 1
                      username: alice
                      role: user
                      status: active
                      created_at: "2026-09-08T12:00:00Z"
                validationError:
                  summary: 参数校验失败
                  value:
                    code: 1001
                    message: 用户名格式无效
                    data: null
                conflict:
                  summary: 用户名已存在
                  value:
                    code: 4001
                    message: 用户名已存在
                    data: null
                registerLimitExceeded:
                  summary: 当日注册量已达上限
                  value:
                    code: 4008
                    message: 当日注册量已达上限
                    data: null
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      description: |
        使用用户名和密码登录，成功后返回 JWT 令牌和用户信息。

        **安全约束：**
        - 登录失败统一返回 `用户名或密码错误`，不暴露用户是否存在。
        - 被禁用（disabled）的用户无法登录，错误信息与密码错误一致。
        - password 字段为前端使用 RSA 公钥加密后 base64 编码的密文，非明文密码。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: <base64-encoded-RSA-ciphertext>
      responses:
        '200':
          description: 登录成功或失败（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 登录成功
                  value:
                    code: 0
                    message: 成功
                    data:
                      token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1aWQiOjEsInVzZXJuYW1lIjoiYWxpY2UiLCJyb2xlIjoidXNlciIsImlzcyI6ImdvLWdhbWUtc2VydmVyIiwic3ViIjoiMSIsImV4cCI6MTczMzQ1NjAwMCwiaWF0IjoxNzMzMzcwNDAwLCJuYmYiOjE3MzMzNzA0MDAsImp0aSI6IjU1MGU4NDAwLWUyOWItNDFkNC1hNzE2LTQ0NjY1NTQ0MDAwMCJ9.signature
                      user:
                        id: 1
                        username: alice
                        role: user
                        status: active
                        created_at: "2026-09-08T12:00:00Z"
                authFailed:
                  summary: 用户名或密码错误
                  value:
                    code: 2001
                    message: 用户名格式无效 or password
                    data: null
                validationError:
                  summary: 参数校验失败
                  value:
                    code: 1001
                    message: 用户名格式无效
                    data: null
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 获取当前用户信息
      description: |
        根据 JWT 中的用户 ID 查询最新的用户信息。

        服务端会从数据库实时读取用户状态，而非仅依赖令牌快照。
        如果用户已被禁用或不存在，将返回资源不存在错误。
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 用户信息或认证错误（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 获取成功
                  value:
                    code: 0
                    message: 成功
                    data:
                      id: 1
                      username: alice
                      role: user
                      status: active
                      created_at: "2026-09-08T12:00:00Z"
                tokenMissing:
                  summary: 未携带令牌
                  value:
                    code: 2002
                    message: 需要认证
                    data: null
                tokenInvalid:
                  summary: 令牌无效或过期
                  value:
                    code: 2002
                    message: 令牌无效
                    data: null
                userNotFound:
                  summary: 用户不存在或已禁用
                  value:
                    code: 4004
                    message: user not found
  /api/v1/auth/password/update:
    post:
      tags: [auth]
      summary: 修改密码
      description: |
        已登录用户修改自己的密码。
        请求需要携带有效的 JWT，服务端会校验旧密码后更新为新密码。
        - old_password 和 new_password 字段均为前端使用 RSA 公钥加密后 base64 编码的密文，非明文密码。
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              old_password: <base64-encoded-RSA-ciphertext>
              new_password: <base64-encoded-RSA-ciphertext>
      responses:
        '200':
          description: 修改成功或业务错误（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 修改成功
                  value:
                    code: 0
                    message: 成功
                    data: null
                oldPasswordWrong:
                  summary: 原密码错误
                  value:
                    code: 2001
                    message: 原密码错误
                    data: null
                tokenMissing:
                  summary: 未携带令牌
                  value:
                    code: 2002
                    message: 需要认证
                    data: null
                tokenInvalid:
                  summary: 令牌无效或过期
                  value:
                    code: 2002
                    message: 令牌无效
                    data: null
                validationFailed:
                  summary: 新密码格式无效
                  value:
                    code: 1001
                    message: 密码格式无效
                    data: null
  /api/v1/admin/ping:
    get:
      tags: [admin]
      summary: 管理员权限校验
      description: |
        仅用于验证管理员权限中间件是否正常工作。

        请求必须携带有效的 admin 角色 JWT，否则返回认证或权限错误。
      operationId: adminPing
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 管理员权限校验通过或失败（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 管理员权限通过
                  value:
                    code: 0
                    message: 成功
                    data:
                      message: 管理员权限验证通过
                tokenMissing:
                  summary: 未携带令牌
                  value:
                    code: 2002
                    message: 需要认证
                    data: null
                tokenInvalid:
                  summary: 令牌无效或过期
                  value:
                    code: 2002
                    message: 令牌无效
                    data: null
                forbidden:
                  summary: 普通用户无权访问
                  value:
                    code: 3001
                    message: 权限不足
                    data: null
  /api/v1/ai/providers/list:
    get:
      tags: [ai]
      summary: 列出当前用户的 AI 产商配置
      description: |
        返回当前用户的所有产商配置及其模型列表。

        响应列表头部固定包含一个通过配置文件提供的只读默认 AI 产商（`id=0, is_default=true`），
        该默认产商包含一个只读默认模型（`id=0, is_default=true`），用户不可修改或删除。

        **安全约束：**
        - 响应中不包含任何 API Key 字段，仅通过 `has_api_key` 指示是否已配置。
      operationId: listAIProviders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功返回产商列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: 成功
                data:
                  - id: 0
                    provider_name: OpenAI
                    base_url: https://api.openai.com/v1
                    status: active
                    is_default: true
                    has_api_key: true
                    models:
                      - id: 0
                        model_name: gpt-4o-mini
                        status: active
                        is_default: true
                        created_at: "2026-09-08T12:00:00Z"
                    created_at: "2026-09-08T12:00:00Z"
                  - id: 1
                    provider_name: Anthropic
                    base_url: https://api.anthropic.com
                    status: active
                    is_default: false
                    has_api_key: true
                    models:
                      - id: 1
                        model_name: claude-3-5-sonnet
                        status: active
                        is_default: false
                        created_at: "2026-09-08T13:00:00Z"
                    created_at: "2026-09-08T13:00:00Z"
  /api/v1/ai/providers/create:
    post:
      tags: [ai]
      summary: 新增 AI 产商配置
      description: |
        创建当前用户的 AI 产商配置。

        **安全约束：**
        - `encrypted_api_key` 是前端使用 RSA 公钥加密后的 base64 密文，服务端 RSA 解密后通过 AES-256-GCM 加密入库。
        - API Key 在任何响应中都不返回。
        - 产商名称和模型名称均为用户自由输入，后端仅做长度校验（1-128 字符）。
      operationId: createAIProvider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderRequest'
            example:
              provider_name: OpenAI
              base_url: https://api.openai.com/v1
              encrypted_api_key: base64-encoded-rsa-ciphertext
      responses:
        '200':
          description: 创建成功或失败（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 创建成功
                  value:
                    code: 0
                    message: 成功
                    data:
                      id: 1
                      provider_name: OpenAI
                      base_url: https://api.openai.com/v1
                      status: active
                      is_default: false
                      has_api_key: true
                      models: []
                      created_at: "2026-09-08T12:00:00Z"
                decryptFailed:
                  summary: API Key 解密失败
                  value:
                    code: 4006
                    message: API Key 解密失败
                    data: null
  /api/v1/ai/providers/update:
    post:
      tags: [ai]
      summary: 更新 AI 产商配置
      description: |
        更新产商名称、Base URL、状态或 API Key。所有字段可选，未提供的字段保留原值。

        **安全约束：**
        - `id=0` 的默认产商不可修改，返回业务码 4005。
        - 如提供 `encrypted_api_key`，服务端重新 RSA 解密并 AES-256-GCM 加密后更新。
        - API Key 在任何响应中都不返回。
      operationId: updateAIProvider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderRequest'
            example:
              id: 1
              provider_name: Anthropic
              base_url: https://api.anthropic.com
      responses:
        '200':
          description: 更新成功或失败（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 更新成功
                  value:
                    code: 0
                    message: 成功
                    data:
                      id: 1
                      provider_name: Anthropic
                      base_url: https://api.anthropic.com
                      status: active
                      is_default: false
                      has_api_key: true
                      models: []
                      created_at: "2026-09-08T12:00:00Z"
                defaultReadOnly:
                  summary: 默认产商不可修改
                  value:
                    code: 4005
                    message: 默认 AI 配置不可修改
                    data: null
                notFound:
                  summary: 产商不存在
                  value:
                    code: 4004
                    message: 产商不存在
                    data: null
  /api/v1/ai/providers/delete:
    post:
      tags: [ai]
      summary: 删除 AI 产商配置
      description: |
        删除产商配置及其关联的所有模型。

        **安全约束：**
        - `id=0` 的默认产商不可删除，返回业务码 4005。
        - 删除前校验产商归属权，跨用户访问返回 4004。
      operationId: deleteAIProvider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProviderRequest'
            example:
              id: 1
      responses:
        '200':
          description: 删除成功或失败（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 删除成功
                  value:
                    code: 0
                    message: 成功
                    data: null
                defaultReadOnly:
                  summary: 默认产商不可删除
                  value:
                    code: 4005
                    message: 默认 AI 配置不可删除
                    data: null
  /api/v1/ai/models/create:
    post:
      tags: [ai]
      summary: 新增 AI 模型
      description: |
        在指定产商下新增模型配置。

        **安全约束：**
        - 校验产商归属当前用户，跨用户访问返回 4004。
      operationId: createAIModel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
            example:
              provider_id: 1
              model_name: gpt-4o
      responses:
        '200':
          description: 创建成功或失败（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: 成功
                data:
                  id: 1
                  model_name: gpt-4o
                  status: active
                  is_default: false
                  created_at: "2026-09-08T12:00:00Z"
  /api/v1/ai/models/update:
    post:
      tags: [ai]
      summary: 更新 AI 模型
      description: |
        更新模型名称或状态，所有字段可选。

        **安全约束：**
        - `id=0` 的默认模型不可修改，返回业务码 4005。
        - 校验模型所属产商归属当前用户。
      operationId: updateAIModel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
            example:
              id: 1
              model_name: gpt-4o-mini
              status: disabled
      responses:
        '200':
          description: 更新成功或失败（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: 成功
                data:
                  id: 1
                  model_name: gpt-4o-mini
                  status: disabled
                  is_default: false
                  created_at: "2026-09-08T12:00:00Z"
  /api/v1/ai/models/delete:
    post:
      tags: [ai]
      summary: 删除 AI 模型
      description: |
        删除模型配置。

        **安全约束：**
        - `id=0` 的默认模型不可删除，返回业务码 4005。
        - 校验模型所属产商归属当前用户。
      operationId: deleteAIModel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteModelRequest'
            example:
              id: 1
      responses:
        '200':
          description: 删除成功或失败（业务码区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: 成功
                data: null
  /api/v1/ai/go/setting:
    get:
      tags: [aigo]
      summary: 获取围棋对弈配置
      description: 返回当前用户的围棋对弈配置，首次访问时自动创建默认配置（active_model_id=0, allow_ai_end_game=true）。
      operationId: getGoGameSetting
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 对弈配置信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameSettingResponse'
              example:
                code: 0
                message: 成功
                data:
                  active_model_id: 0
                  allow_ai_end_game: true
                  model_name: gpt-4o-mini
                  is_default: true
                  has_api_key: true
  /api/v1/ai/go/setting/update:
    post:
      tags: [aigo]
      summary: 更新围棋对弈配置
      description: 更新用户激活的 AI 模型和对弈配置，所有字段可选，不提供则保留原值。
      operationId: updateGoGameSetting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameSettingRequest'
            example:
              active_model_id: 2
              allow_ai_end_game: false
      responses:
        '200':
          description: 更新成功或失败（业务码区分）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameSettingResponse'
  /api/v1/ai/go/analyze:
    post:
      tags: [aigo]
      summary: 分析棋局
      description: |
        接收当前棋局快照，调用激活的 AI 模型分析后返回下一步落子坐标或结束申请。

        当 allow_ai_end_game 为 true 时，AI 可返回 {"action":"end_game"} 表示申请数子结束游戏；
        为 false 时，AI 必须始终返回落子坐标。
      operationId: analyzeGoGame
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
            example:
              size: 19
              layout: [[0,0,0],[0,1,0],[0,0,0]]
              player: -1
              latestVertex: [1,1]
      responses:
        '200':
          description: 分析结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AnalyzeResponse'
              examples:
                move:
                  summary: 返回落子坐标
                  value:
                    code: 0
                    message: 成功
                    data:
                      action: move
                      vertex: [5, 5]
                endGame:
                  summary: 申请结束游戏
                  value:
                    code: 0
                    message: 成功
                    data:
                      action: end_game
                validationError:
                  summary: 棋局数据无效
                  value:
                    code: 1001
                    message: 棋盘布局行数与尺寸不匹配
                    data: null
                aiCallFailed:
                  summary: AI 调用失败
                  value:
                    code: 9002
                    message: AI 调用失败
                    data: null

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用登录接口返回的 JWT 令牌，格式为 `Bearer <token>`。

        令牌采用 HS256 签名，包含以下自定义声明：
        - `uid`：用户 ID
        - `username`：用户名快照
        - `role`：角色快照（`admin` 或 `user`）
  schemas:
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 业务码，0 表示成功，非 0 表示具体错误类型
          example: 0
        message:
          type: string
          description: 面向客户端的简短提示，不包含内部错误细节
          example: success
        data:
          description: 业务数据，成功时返回具体内容，失败时为 null
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: integer
          nullable: true
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-zA-Z0-9_]+$'
          description: 用户登录名，仅允许 ASCII 字母、数字和下划线，长度 3-64
          example: alice
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: 用户密码，长度 8-128，必须同时包含字母和数字
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: 当前密码，服务端会校验后再允许修改
          example: Secret123
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: 新密码，长度 8-128，必须同时包含字母和数字
          example: Secret123
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          description: 用户登录名
          example: alice
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: 用户密码
          example: Secret123
    UserResponse:
      type: object
      required: [id, username, role, status, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: 用户主键
          example: 1
        username:
          type: string
          description: 用户登录名
          example: alice
        role:
          type: string
          enum: [admin, user]
          description: 用户角色
          example: user
        status:
          type: string
          enum: [active, disabled]
          description: 用户状态，active 可正常登录，disabled 无法登录
          example: active
        created_at:
          type: string
          format: date-time
          description: 用户创建时间
          example: "2026-09-08T12:00:00Z"
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT 令牌，后续请求需放入 Authorization 头
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.signature
        user:
          $ref: '#/components/schemas/UserResponse'
    CreateProviderRequest:
      type: object
      required: [provider_name, base_url, encrypted_api_key]
      properties:
        provider_name:
          type: string
          minLength: 1
          maxLength: 128
          description: 产商名称，用户自由输入
          example: OpenAI
        base_url:
          type: string
          minLength: 1
          maxLength: 512
          description: 产商 API 基础地址
          example: https://api.openai.com/v1
        encrypted_api_key:
          type: string
          description: 使用 RSA 公钥加密后的 base64 编码 API Key 密文
          example: base64-encoded-rsa-ciphertext
    UpdateProviderRequest:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: 目标产商 ID，默认产商为 0
          example: 1
        provider_name:
          type: string
          minLength: 1
          maxLength: 128
          description: 新的产商名称，不提供则保留原值
          example: Anthropic
        base_url:
          type: string
          minLength: 1
          maxLength: 512
          description: 新的 API 基礎地址，不提供则保留原值
          example: https://api.anthropic.com
        encrypted_api_key:
          type: string
          description: 新的 RSA 加密后的 API Key 密文，不提供则保留原值
          example: base64-encoded-rsa-ciphertext
        status:
          type: string
          enum: [active, disabled]
          description: 新的状态值，不提供则保留原值
          example: active
    DeleteProviderRequest:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: 目标产商 ID，默认产商为 0
          example: 1
    CreateModelRequest:
      type: object
      required: [provider_id, model_name]
      properties:
        provider_id:
          type: integer
          format: int64
          description: 目标产商 ID
          example: 1
        model_name:
          type: string
          minLength: 1
          maxLength: 128
          description: 模型名称，用户自由输入
          example: gpt-4o
    UpdateModelRequest:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: 目标模型 ID，默认模型为 0
          example: 1
        model_name:
          type: string
          minLength: 1
          maxLength: 128
          description: 新的模型名称，不提供则保留原值
          example: gpt-4o-mini
        status:
          type: string
          enum: [active, disabled]
          description: 新的状态值，不提供则保留原值
          example: disabled
    DeleteModelRequest:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: 目标模型 ID，默认模型为 0
          example: 1
    ProviderResponse:
      type: object
      required: [id, provider_name, base_url, status, is_default, has_api_key, models]
      properties:
        id:
          type: integer
          format: int64
          description: 产商配置主键，默认产商为 0
          example: 1
        provider_name:
          type: string
          description: 产商名称
          example: OpenAI
        base_url:
          type: string
          description: 产商 API 基础地址
          example: https://api.openai.com/v1
        status:
          type: string
          enum: [active, disabled]
          description: 产商状态
          example: active
        is_default:
          type: boolean
          description: 是否为配置文件提供的只读默认产商
          example: false
        has_api_key:
          type: boolean
          description: 是否已配置 API Key。响应中不返回 Key 本身。
          example: true
        models:
          type: array
          description: 该产商下的模型列表
          items:
            $ref: '#/components/schemas/ModelResponse'
        created_at:
          type: string
          format: date-time
          description: 产商配置创建时间
          example: "2026-09-08T12:00:00Z"
    ModelResponse:
      type: object
      required: [id, model_name, status, is_default]
      properties:
        id:
          type: integer
          format: int64
          description: 模型配置主键，默认模型为 0
          example: 1
        model_name:
          type: string
          description: 模型名称
          example: gpt-4o
        status:
          type: string
          enum: [active, disabled]
          description: 模型状态
          example: active
        is_default:
          type: boolean
          description: 是否为配置文件提供的只读默认模型
          example: false
        created_at:
          type: string
          format: date-time
          description: 模型配置创建时间
          example: "2026-09-08T12:00:00Z"





    AnalyzeRequest:
      type: object
      required: [size, layout, player]
      properties:
        size:
          oneOf:
            - type: integer
            - type: string
          description: 棋盘尺寸，可为数字或字符串
          example: 19
        layout:
          type: array
          description: 棋盘布局，1=黑子，-1=白子，0=空位
          items:
            type: array
            items:
              type: integer
              enum: [-1, 0, 1]
          example: [[0,0,0],[0,1,0],[0,0,0]]
        player:
          type: integer
          enum: [1, -1]
          description: 当前执棋方
          example: 1
        ko:
          $ref: '#/components/schemas/KoInfo'
        latestVertex:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: 最新一手棋子的棋盘坐标
          example: [1, 1]
    KoInfo:
      type: object
      required: [sign, vertex]
      properties:
        sign:
          type: integer
          enum: [1, -1]
          description: 劫子发生的棋子标记
          example: -1
        vertex:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: 劫子发生时的顶点
          example: [3, 3]
    UpdateGameSettingRequest:
      type: object
      properties:
        active_model_id:
          type: integer
          format: int64
          description: 激活的 AI 模型 ID，0 表示默认模型
          example: 2
        allow_ai_end_game:
          type: boolean
          description: 是否允许 AI 申请结束游戏
          example: false
    GameSettingResponse:
      type: object
      required: [active_model_id, allow_ai_end_game, model_name, is_default, has_api_key]
      properties:
        active_model_id:
          type: integer
          format: int64
          description: 激活的 AI 模型 ID，0 表示默认模型
          example: 0
        allow_ai_end_game:
          type: boolean
          description: 是否允许 AI 申请结束游戏
          example: true
        model_name:
          type: string
          description: 激活模型的名称
          example: gpt-4o-mini
        is_default:
          type: boolean
          description: 是否为只读默认模型
          example: true
        has_api_key:
          type: boolean
          description: 关联产商是否已配置 API Key
          example: true
    AnalyzeResponse:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [move, end_game]
          description: AI 决定的动作
          example: move
        vertex:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: 落子坐标，仅当 action 为 move 时存在
          example: [5, 5]

