openapi: 3.0.3
info:
  title: Go Game Server Auth API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/v1/auth/register:
    post:
      summary: Register a normal user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Success or validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Success or authentication error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/v1/auth/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Get current user
      responses:
        '200':
          description: Success or token error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/v1/admin/ping:
    get:
      security: [{ bearerAuth: [] }]
      summary: Admin-only endpoint
      responses:
        '200':
          description: Success, token error or forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: '业务码，0 表示成功，非 0 表示具体错误' }
        message: { type: string }
        data: { type: object }
        request_id: { type: string }
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        role: { type: string, enum: [user] }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
    UserResponse:
      type: object
      required: [id, username, role, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/UserResponse' }
